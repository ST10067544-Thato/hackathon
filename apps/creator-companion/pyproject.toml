[project]
name = "creator-companion"
version = "0.1.0"
description = "Creator Companion: an Agno team that monitors connected social accounts through Zernio and turns comments and analytics into a report, reply drafts, and content ideas."
requires-python = ">=3.11"
dependencies = [
  "agno[scheduler]>=3.0.9,<4",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "openai>=1.50",
  "exa-py>=1.9",
  "python-dotenv>=1.0",
  "sqlalchemy>=2.0",
  "python-multipart>=0.0.9",
  "ag-ui-protocol>=0.1.22",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
creator-companion = "creator_companion.app:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["creator_companion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
